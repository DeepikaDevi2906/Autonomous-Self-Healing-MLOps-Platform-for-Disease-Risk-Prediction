server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;   # batch CSV uploads

  # API calls go to the FastAPI container; long timeouts for monitoring checks
  location ~ ^/(api|health|predict)(/|$) {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
  }

  location / {
    try_files $uri /index.html;
  }
}
